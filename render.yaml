services:
  - type: web
    name: abiz-locker-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: ABIZ_DB_URL
        fromDatabase:
          name: abizlocker-db
          property: connectionString
      - key: PORT
        value: 8080

databases:
  - name: abizlocker-db
    plan: free
    region: oregon
    databaseName: abizlocker
    user: abizlocker
